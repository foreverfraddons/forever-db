# Builds the WoW Forever master database from every open Classic / Forever database plus
# players' in-game recordings, cross-checks the sources against each other (dist/report.md),
# and publishes the ForeverDB addon.
# Runs twice a day, so a change in any source is picked up within ~12 hours; also runs when
# new recordings are pushed to the addon repo (repository_dispatch), or by hand.
# Only when the merged data actually changed: commits the ForeverDB addon folder, tags it,
# uploads it to CurseForge (project 1807282) and refreshes the "latest" GitHub release.
name: Build database

on:
  schedule:
    - cron: "17 7,19 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Release even if the data didn't change"
        type: boolean
        default: false
  repository_dispatch:
    types: [new-recordings]

permissions:
  contents: write

concurrency:
  group: build-db
  cancel-in-progress: false

env:
  ADDON_REPO: ${{ vars.ADDON_REPO }}          # e.g. yourname/CommandCenter (holds collected/)
  CF_PROJECT: "1807282"                       # CurseForge project of the ForeverDB addon
  # "off" leaves out QuestieDB's generated delta-base (its authors built it from Wowhead's Forever pages)
  QUESTIE_GENERATED: ${{ vars.QUESTIE_GENERATED || 'on' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Tests
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq lua5.1 >/dev/null
          python tests/run_tests.py

      - name: Get the source databases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p work/src
          # cMaNGOS classic-db (GPL-3.0): full world dump in Full_DB/
          if git clone -q --depth 1 --filter=blob:none --sparse https://github.com/cmangos/classic-db.git work/src/cmangos; then
            git -C work/src/cmangos sparse-checkout set Full_DB
            echo "REF_CMANGOS=$(git -C work/src/cmangos rev-parse --short HEAD)" >> "$GITHUB_ENV"
          else echo "::warning::cMaNGOS classic-db could not be fetched"; fi
          # VMaNGOS (GPL-2.0-or-later): nightly MySQL dump attached to the db_latest release
          mkdir -p work/src/vmangos
          if gh release download db_latest -R vmangos/core -D work/src/vmangos -p '*.zip'; then
            rm -f work/src/vmangos/*sqlite*.zip        # keep the MySQL dump only
            ls -la work/src/vmangos
            echo "REF_VMANGOS=$(ls work/src/vmangos | head -1 | sed 's/^db-//; s/\.zip$//')" >> "$GITHUB_ENV"
          else echo "::warning::VMaNGOS database dump could not be fetched"; fi
          # pfQuest (MIT): Lua database files + translations
          if git clone -q --depth 1 --filter=blob:none --sparse https://github.com/shagu/pfQuest.git work/src/pfquest; then
            git -C work/src/pfquest sparse-checkout set --no-cone '/db/*.lua' '/db/*/units.lua' '/db/*/objects.lua' '/db/*/items.lua' '/db/*/quests.lua' '/LICENSE'
            echo "REF_PFQUEST=$(git -C work/src/pfquest rev-parse --short HEAD)" >> "$GITHUB_ENV"
          else echo "::warning::pfQuest could not be fetched"; fi
          # QuestieDB (GPL-3.0): WoW Forever data + Forever corrections + zone tables + translations
          if git clone -q --depth 1 --filter=blob:none --sparse https://github.com/Questie/QuestieDB.git work/src/questie; then
            git -C work/src/questie sparse-checkout set --no-cone '/data/Forever/' '/src/corrections/' '/support/' '/l10n/Forever/' \
              '/generator/l10n-inputs.lua' '/LICENSE.md' '/gpl-3.0.md'
            echo "REF_QUESTIE=$(git -C work/src/questie rev-parse --short HEAD)" >> "$GITHUB_ENV"
          else echo "::warning::QuestieDB could not be fetched"; fi
          # AllTheThings (MIT): its WoW Forever database sources + the Forever client tables (wago.tools CSV)
          if git clone -q --depth 1 --filter=blob:none --sparse https://github.com/ATTWoWAddon/AllTheThings.git work/src/att; then
            git -C work/src/att sparse-checkout set --no-cone '/.contrib/.db/shared/' '/.contrib/.db/forever/' '/LICENSE'
            echo "REF_ATT=$(git -C work/src/att rev-parse --short HEAD)" >> "$GITHUB_ENV"
          else echo "::warning::AllTheThings could not be fetched"; fi
          # LegacyForever (GPL-3.0-or-later): Legacy challenges, exploration areas, criterion locations
          if git clone -q --depth 1 --filter=blob:none --sparse https://github.com/cjber/legacy-forever.git work/src/legacy; then
            git -C work/src/legacy sparse-checkout set --no-cone '/Data/' '/tools/locations.json' '/LICENSE'
            echo "REF_LEGACY=$(git -C work/src/legacy rev-parse --short HEAD)" >> "$GITHUB_ENV"
          else echo "::warning::LegacyForever could not be fetched"; fi
          # Shortest Path Forever (GPL-3.0-or-later): flight paths, boats, portals, teleports, town services
          if git clone -q --depth 1 --filter=blob:none --sparse https://github.com/cjber/shortest-path-forever.git work/src/spf; then
            git -C work/src/spf sparse-checkout set --no-cone '/Data/' '/LICENSE'
            echo "REF_SPF=$(git -C work/src/spf rev-parse --short HEAD)" >> "$GITHUB_ENV"
          else echo "::warning::Shortest Path Forever could not be fetched"; fi
          # Drop Tables (data CC BY-SA 4.0): loot, money, skinning and kill spots players record on WoW Forever
          if git clone -q --depth 1 --filter=blob:none --sparse https://github.com/valcheffnet/DropTables.git work/src/droptables; then
            git -C work/src/droptables sparse-checkout set --no-cone '/data/shared.json' '/LICENSE-DATA'
            echo "REF_DROPTABLES=$(git -C work/src/droptables rev-parse --short HEAD)" >> "$GITHUB_ENV"
          else echo "::warning::Drop Tables could not be fetched"; fi

      - name: Cache source imports
        uses: actions/cache@v4
        with:
          path: work/cache
          key: src-${{ env.REF_CMANGOS }}-${{ env.REF_VMANGOS }}-${{ env.REF_PFQUEST }}-${{ env.REF_QUESTIE }}-${{ env.REF_ATT }}-${{ env.REF_LEGACY }}-${{ env.REF_SPF }}-${{ env.QUESTIE_GENERATED }}-${{ hashFiles('tools/*.py', 'tools/lua/*.lua', 'tools/att/*.py', 'tools/att/*.lua') }}
          restore-keys: src-

      - name: Import every source
        run: |
          mkdir -p work/cache
          # re-import a source when its version OR the import tools changed
          TOOLS=$(cat tools/*.py tools/lua/*.lua tools/att/*.py tools/att/*.lua | sha256sum | cut -c1-12)
          imp() {  # name ref command...
            local name=$1 ref=$2; shift 2
            [ -n "$ref" ] && ref="$ref-$TOOLS"
            [ -n "$ref" ] || { echo "skip $name (not fetched)"; return 0; }
            if [ -f "work/cache/$name.ref" ] && [ "$(cat work/cache/$name.ref)" = "$ref" ] && [ -f "work/cache/src-$name.json" ]; then
              echo "$name $ref: cached"; return 0; fi
            "$@" && echo "$ref" > "work/cache/$name.ref" || echo "::warning::import of $name failed"
          }
          imp cmangos "$REF_CMANGOS" python tools/import_base.py work/src/cmangos/Full_DB work/cache/src-cmangos.json
          imp vmangos "$REF_VMANGOS" python tools/import_base.py work/src/vmangos work/cache/src-vmangos.json
          GEN=""; [ "$QUESTIE_GENERATED" = "off" ] && GEN="no-generated"
          CONV=work/src/questie/data/Forever/conversion.json
          imp questie "$REF_QUESTIE-$QUESTIE_GENERATED" sh -c "lua5.1 tools/lua/export.lua questie work/src/questie Forever work/cache/questie.json $GEN && python tools/import_addons.py questie work/cache/questie.json work/cache/src-questie.json --conversion $CONV --dungeons work/src/questie/support/Forever/Zones/dungeons.lua"
          # pfQuest positions are moved onto Forever's maps with QuestieDB's zone tables
          imp pfquest "$REF_PFQUEST-$REF_QUESTIE" sh -c "lua5.1 tools/lua/export.lua pfquest work/src/pfquest work/cache/pfquest.json && python tools/import_addons.py pfquest work/cache/pfquest.json work/cache/src-pfquest.json --zones work/cache/questie.json --conversion $CONV"
          # AllTheThings: its own Lua runs (tools/att), then the Forever client tables it ships
          imp att "$REF_ATT" sh -c "python tools/att/prepare.py work/src/att/.contrib/.db work/att && lua5.1 tools/att/run.lua work/att/order.txt work/cache/att.json && python tools/import_att.py work/cache/att.json work/cache/src-att.json"
          imp client "$REF_ATT" python tools/import_client.py work/src/att/.contrib/.db/forever/.config/.wago work/cache/src-client.json
          # zone borders from the Forever client's own terrain (every outdoor continent's ADT map chunks, from
          # wago.tools for the client build ATT ships; only a small grid per continent is kept in the cache)
          CB=$(ls work/src/att/.contrib/.db/forever/.config/.wago/AreaTable.*.csv 2>/dev/null | sed -E 's/.*AreaTable\.([0-9.]+)\.csv/\1/' | head -1)
          if [ -n "$CB" ]; then
            mkdir -p work/terrain-csv
            cp work/src/att/.contrib/.db/forever/.config/.wago/{AreaTable,UiMap,UiMapAssignment}.$CB.csv work/terrain-csv/
            [ -s "work/terrain-csv/Map.$CB.csv" ] || curl -sSfL -A "forever-db/1" -o "work/terrain-csv/Map.$CB.csv" "https://wago.tools/db2/Map/csv?build=$CB" \
              || echo "::warning::Map table not fetched from wago.tools"
            imp terrain "$CB" python tools/import_terrain.py work/terrain-csv work/cache/terrain work/cache/src-terrain.json --build "$CB"
          fi
          imp legacy "$REF_LEGACY" sh -c "lua5.1 tools/lua/export.lua ns work/cache/legacy.json work/src/legacy/Data/Legacy.lua work/src/legacy/Data/Explore.lua && python tools/import_extra.py legacy work/cache/legacy.json work/cache/src-legacy.json --locations work/src/legacy/tools/locations.json"
          imp spf "$REF_SPF" sh -c "lua5.1 tools/lua/export.lua ns work/cache/spf.json \$(ls work/src/spf/Data/*.lua | grep -vE 'Credits|Heights|RoadCells|RoadEdges') && python tools/import_extra.py spf work/cache/spf.json work/cache/src-spf.json"

      - name: Merge and cross-check the sources
        run: |
          mkdir -p dist
          # never publish a smaller database because a source failed: every source must be there
          # (a failed import keeps the last good one from the cache)
          for s in client questie att vmangos cmangos pfquest legacy spf; do
            [ -f "work/cache/src-$s.json" ] || { echo "::error::source $s is missing - not publishing"; exit 1; }
          done
          # priority order: Forever data first, then the most accurate vanilla databases
          python tools/merge.py --out work/base.json --report dist/report.json \
            client=work/cache/src-client.json questie=work/cache/src-questie.json att=work/cache/src-att.json \
            vmangos=work/cache/src-vmangos.json cmangos=work/cache/src-cmangos.json pfquest=work/cache/src-pfquest.json \
            legacy=work/cache/src-legacy.json spf=work/cache/src-spf.json \
            $( [ -f work/cache/src-terrain.json ] && echo terrain=work/cache/src-terrain.json )
          python - <<'PY'
          import json, os
          src = json.load(open("sources.json"))
          for s in src:
              s["ref"] = os.environ.get("REF_" + s["name"].upper(), "")
          json.dump(src, open("work/sources.json", "w"), indent=1)
          PY
          cat dist/report.md >> "$GITHUB_STEP_SUMMARY"
          # and stop if the merged data shrank a lot compared with the last published build
          python - <<'PY'
          import json, os, sys
          if not os.path.exists("manifest.json"):
              sys.exit(0)
          old = json.load(open("manifest.json")).get("counts", {})
          new = json.load(open("dist/report.json"))["merged"]
          for t in ("npc", "item", "quest", "drop"):
              if old.get(t) and new.get(t, 0) < 0.9 * old[t]:
                  sys.exit("::error::%s fell from %d to %d - not publishing" % (t, old[t], new.get(t, 0)))
          PY

      - name: Get recordings from the addon repo
        if: env.ADDON_REPO != ''
        env:
          TOKEN: ${{ secrets.PIPELINE_TOKEN }}
        run: |
          git clone --depth 1 --filter=blob:none --sparse "https://x-access-token:${TOKEN}@github.com/${ADDON_REPO}.git" addon-src
          git -C addon-src sparse-checkout set collected
          mkdir -p addon-src/collected

      - name: Build master
        run: |
          mkdir -p dist
          mkdir -p addon-src/collected
          # recorded/ keeps every recording for good (counts never go down, nothing recorded is ever dropped)
          python tools/build.py --base work/base.json --collected collected addon-src/collected --keep recorded --out dist/forever.json \
            --sources-json work/sources.json --droptables work/src/droptables/data/shared.json \
            --source-note "WoW Forever client tables + AllTheThings + QuestieDB (Forever) + VMaNGOS + cMaNGOS classic-db + pfQuest + LegacyForever + Shortest Path Forever, cross-checked, + Drop Tables + WoW Forever in-game recordings"

      - name: Changed?
        id: diff
        run: |
          NEW=$(python -c "import json;print(json.load(open('dist/forever.json'))['meta']['hash'])")
          OLD=$(python -c "import json,os;print(json.load(open('manifest.json'))['hash'] if os.path.exists('manifest.json') else '')")
          echo "new=$NEW" >> "$GITHUB_OUTPUT"
          if [ "$NEW" = "$OLD" ] && [ "${{ inputs.force }}" != "true" ]; then echo "changed=false" >> "$GITHUB_OUTPUT"; else echo "changed=true" >> "$GITHUB_OUTPUT"; fi

      - name: Keep recordings (also when the data didn't change)
        if: steps.diff.outputs.changed != 'true'
        run: |
          if [ -n "$(git status --porcelain recorded)" ]; then
            git config user.name "forever-db bot"
            git config user.email "actions@users.noreply.github.com"
            git add recorded
            git commit -m "Keep recordings" && git push origin HEAD
          fi

      - name: Slices
        if: steps.diff.outputs.changed == 'true'
        run: |
          for spec in slices/*.json; do
            name=$(basename "$spec" .json)
            target=$(python -c "import json;print(json.load(open('$spec')).get('target','$name'))")
            mkdir -p "out/$name/$target"
            toc=$(python -c "import json;print(json.load(open('$spec')).get('toc',''))")
            if [ -f "slices/$name.toc" ] && [ -n "$toc" ]; then cp "slices/$name.toc" "out/$name/$target/$toc"; fi
            python tools/slice.py "$spec" dist/forever.json "out/$name/$target"
            cp LICENSE-DATA.txt "out/$name/$target/"
            for lic in work/src/cmangos/LICENSE.md work/src/questie/gpl-3.0.md; do if [ -f "$lic" ]; then cp "$lic" "out/$name/$target/LICENSE-GPL.txt"; break; fi; done
            if [ -f work/src/pfquest/LICENSE ]; then cp work/src/pfquest/LICENSE "out/$name/$target/LICENSE-pfQuest.txt"; fi
            if [ -f work/src/att/LICENSE ]; then cp work/src/att/LICENSE "out/$name/$target/LICENSE-AllTheThings.txt"; fi
            if [ -f work/src/droptables/LICENSE-DATA ]; then cp work/src/droptables/LICENSE-DATA "out/$name/$target/LICENSE-DropTables.txt"; fi
            (cd "out/$name" && zip -qr "../../dist/$name.zip" "$target")
          done
          gzip -kf dist/forever.json

      - name: Publish
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json
          m = json.load(open("dist/forever.json"))["meta"]
          json.dump(m, open("manifest.json", "w"), indent=1, sort_keys=True)
          PY
          # the ForeverDB addon folder lives in the repo so the CurseForge packager can ship it
          VERSION="$(date -u +%Y.%m.%d).${{ github.run_number }}"
          # one CurseForge package, three LoadOnDemand folders: ForeverDB (everything addons use),
          # ForeverDB_Full (uncapped drop lists, every map position, source of each entry), ForeverDB_Locales
          for d in ForeverDB ForeverDB_Full ForeverDB_Locales; do
            src=$(ls -d out/*/"$d" | head -1)
            rm -rf "$d"; cp -r "$src" "$d"
            sed -i "s/^## Version:.*/## Version: $VERSION/" "$d/$d.toc"
          done
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          git config user.name "forever-db bot"
          git config user.email "actions@users.noreply.github.com"
          cp dist/report.md REPORT.md
          git add manifest.json ForeverDB ForeverDB_Full ForeverDB_Locales REPORT.md recorded
          git commit -m "ForeverDB $VERSION (data ${{ steps.diff.outputs.new }})" || true
          git tag "v$VERSION"
          git push origin HEAD "v$VERSION"
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest dist/forever.json.gz dist/*.zip dist/report.md dist/report.json --title "Forever database (latest)" \
            --notes "ForeverDB $VERSION, built $(date -u +%F) from the Forever client tables + AllTheThings ${REF_ATT}, QuestieDB ${REF_QUESTIE}, VMaNGOS ${REF_VMANGOS}, cMaNGOS ${REF_CMANGOS}, pfQuest ${REF_PFQUEST}, LegacyForever ${REF_LEGACY}, Shortest Path Forever ${REF_SPF}, Drop Tables ${REF_DROPTABLES} + recordings. Hash ${{ steps.diff.outputs.new }}. See report.md for the cross-check."

      - name: Upload ForeverDB to CurseForge
        if: steps.diff.outputs.changed == 'true'
        uses: BigWigsMods/packager@v2
        with:
          args: -p ${{ env.CF_PROJECT }}
        env:
          CF_API_KEY: ${{ secrets.CF_API_KEY }}

      - name: Tell other repos
        if: steps.diff.outputs.changed == 'true' && vars.DB_CONSUMERS != ''
        env:
          GH_TOKEN: ${{ secrets.PIPELINE_TOKEN }}
        run: |
          # repos that want a ping when the data changes: DB_CONSUMERS variable (space separated owner/repo)
          for r in ${{ vars.DB_CONSUMERS }}; do gh api "repos/$r/dispatches" -f event_type=db-updated -f "client_payload[version]=$VERSION" || true; done
